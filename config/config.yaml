
model:
  model_type: fcn
  encoder_name: efficientnet-b7
  num_classes: 1
  sgm_type: hard
  sgm_threshold: 0.5

dataset:
  train: ./archive/train.json
  val: ./archive/val.json
  test: ./archive/test.json
  resize: 448

train:
  save_path: "./artifacts/lightning/"
  seed: 42
  batch_size: 4
  lr: 5e-7
  lr_unet: 1e-4
  max_lr: 1e-3
  # Explicit device; old accelerator/devices are retained for legacy test scripts.
  device: "cuda:0"
  accelerator: "gpu"
  devices: 1
  max_epochs: 1000
  pretrained: False
  max_steps: -1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  num_workers: 0
  patience: 10

test:
  save_output_path: "photo_output"

log:  
  path: "./logs/"
  wandb: False
  tensorboard: False

checkpoints:
  root_path: "./logs/oral"
  version: "last"

metrics:
  exclude_back: true

ensemble:
  check_fcn_bin: fcn_bin
  check_dl_bin: deeplab_bin
  check_unet_eff_bin: unet_eff_bin
  check_unet_res_bin: unet_res_bin
  check_fcn_mul: fcn_mul
  check_dl_mul: deeplab_mul
  check_unet_eff_mul: unet_eff_mul
  check_unet_res_mul: unet_res_mul

  dec_fus: "median"
  type_aggr: "soft"

  